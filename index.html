<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survivor 51 League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="css">
:root{
  --ground:#EDF0EA; --surface:#FAFBF7; --sunk:#E3E8E0; --ink:#16211C; --muted:#5A6A61; --line:#D0D8CE;
  --torch:#C9601A; --torch-soft:#F6E2D2; --torch-ink:#8F3F0C;
  --good:#2C7A4B; --good-soft:#DCEEE2; --bad:#B0352A; --bad-soft:#F6DEDA; --warn:#9A6A00; --warn-soft:#F5EACB;
  --snuffed:#A7B1AA;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1512; --surface:#17201B; --sunk:#1E2923; --ink:#E6ECE5; --muted:#94A49B; --line:#2B3831;
    --torch:#F0893B; --torch-soft:#3A2517; --torch-ink:#F7AD73;
    --good:#62C48E; --good-soft:#18301F; --bad:#EF6E60; --bad-soft:#3A1C19; --warn:#E3B54A; --warn-soft:#352C14;
    --snuffed:#56635B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1512; --surface:#17201B; --sunk:#1E2923; --ink:#E6ECE5; --muted:#94A49B; --line:#2B3831;
  --torch:#F0893B; --torch-soft:#3A2517; --torch-ink:#F7AD73;
  --good:#62C48E; --good-soft:#18301F; --bad:#EF6E60; --bad-soft:#3A1C19; --warn:#E3B54A; --warn-soft:#352C14;
  --snuffed:#56635B; color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 96px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:clamp(2.3rem,6vw,3.6rem);font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:600;letter-spacing:.04em}
.eyebrow{font:600 .8rem/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--torch-ink)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--torch);outline-offset:2px}

header.top{display:grid;gap:18px;margin-bottom:28px}
.title-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;border-top:2px solid var(--ink);padding-top:14px}
.stat b{display:block;font:700 1.9rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--torch-soft);border-radius:10px;padding:14px 16px}
.cta p{margin:0;flex:1 1 260px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--torch);border-color:var(--torch);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.875rem}

.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
section{display:grid;gap:14px;align-content:start}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.rank{font:700 1.2rem/1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.pname{font-weight:600;overflow-wrap:anywhere}
.pmeta{font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;font:600 .75rem/1 var(--body);letter-spacing:.03em;padding:5px 9px;border-radius:99px;white-space:nowrap}
.pill.alive{background:var(--good-soft);color:var(--good)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.row.is-out .pname{color:var(--muted)}
.detail{grid-column:1/-1;display:grid;gap:8px;padding:4px 0 6px;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:3px 8px;border-radius:6px;background:var(--sunk);white-space:nowrap}
.chip.used{text-decoration:line-through;color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted)}

.tribes{display:grid;gap:16px}
.tribe h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cw{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:.92rem;text-align:left;width:100%}
button.cw{cursor:pointer}
button.cw:hover{border-color:var(--torch)}
.flame{width:10px;height:14px;flex:none;border-radius:50% 50% 45% 45%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 70%,#FFD37A 0 30%,var(--torch) 60%);box-shadow:0 0 8px color-mix(in srgb,var(--torch) 55%,transparent)}
.cw.snuffed{color:var(--muted);background:transparent}
.cw.snuffed .flame{background:var(--snuffed);box-shadow:none;height:4px;width:12px;border-radius:2px;margin-block:5px}
.cw.going{border-color:var(--bad);background:var(--bad-soft)}
.cw.going .flame{background:var(--bad);box-shadow:none}
.cw .ep{margin-left:auto;font-size:.75rem;color:var(--muted);white-space:nowrap}
.cw .nm{min-width:0;overflow-wrap:anywhere}

.sheet-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.sheet{border-collapse:collapse;width:100%;font-size:.9rem}
.sheet th,.sheet td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.sheet thead th{font:600 .8rem/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.sheet tbody th{font-weight:600;position:sticky;left:0;background:var(--surface)}
.sheet td.sank{color:var(--bad);font-weight:600}
.sheet td.pending{color:var(--muted);font-style:italic}
.sheet tr:last-child th,.sheet tr:last-child td{border-bottom:0}

/* commissioner */
.admin{background:var(--surface);border:2px solid var(--torch);border-radius:14px;padding:18px;display:grid;gap:18px;margin-bottom:32px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 12px;font:600 .95rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--torch)}
.fields{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end}
.field{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.field input,.field select,.field textarea,.pickgrid select{background:var(--ground);border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:var(--ink);font-size:.95rem;max-width:100%}
.field input[type="url"]{width:min(420px,80vw)}
textarea{width:100%;min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}
.pickgrid{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pk{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.pk:first-child{border-top:0}
.pk .who{flex:1 1 150px;font-weight:600}
.pk select{flex:0 1 200px}
.note{font-size:.875rem;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.report{font-size:.875rem;margin:0;padding-left:18px}
.list-edit{display:grid;gap:6px}
.le{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.le input[type="text"]{flex:1 1 180px}
.paid{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;white-space:nowrap;cursor:pointer}
.paid input{width:18px;height:18px;accent-color:var(--good)}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;z-index:10}
.savebar .btn.ghost{color:var(--ground);border-color:color-mix(in srgb,var(--ground) 35%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:11}
footer{margin-top:40px;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head><body>

<script id="app-js">
(function(){

var SCRIPT_END = "</" + "script>";
var S = JSON.parse(document.getElementById("league-state").textContent);
var saved = JSON.stringify(S);
var ui = { canEdit:false, artifact:null, tab:"week", open:{}, importReport:null, toast:"" };
var DRAFT_KEY = "s51-league-draft";

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function norm(s){return String(s||"").toLowerCase().replace(/[“”"']/g,"").replace(/\s+/g," ").trim();}
function cById(id){for(var i=0;i<S.castaways.length;i++) if(S.castaways[i].id===id) return S.castaways[i]; return null;}
function cShort(id){var c=cById(id);return c?c.short:id;}

function nyOffset(date){
  try{
    var d=new Date(date+"T23:00:00Z");
    var tz=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",timeZoneName:"shortOffset"}).formatToParts(d).filter(function(p){return p.type==="timeZoneName";})[0].value;
    var m=tz.match(/GMT([+-])(\d+)/); if(m) return m[1]+(m[2].length<2?"0":"")+m[2]+":00";
  }catch(e){}
  return "-04:00";
}
function deadline(e){return new Date(e.date+"T20:00:00"+nyOffset(e.date));}
function fmtDate(date){var d=new Date(date+"T12:00:00");return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});}
function addDays(date,n){var d=new Date(date+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function elimEp(){var m={};S.episodes.forEach(function(e){(e.eliminated||[]).forEach(function(c){if(e.done||!m[c]) m[c]=e.n;});});return m;}
function goneBefore(n){var m={};S.episodes.forEach(function(e){if(e.done&&e.n<n)(e.eliminated||[]).forEach(function(c){m[c]=e.n;});});return m;}
function remainingAt(n){var g=goneBefore(n);return S.castaways.filter(function(c){return !g[c.id];});}
function usedBefore(pid,n){var u={};var pk=S.picks[pid]||{};Object.keys(pk).forEach(function(k){if(+k<n)(pk[k].c||[]).forEach(function(c){u[c]=true;});});return u;}

/* ---------- scoring engine (follows the league rules) ---------- */
function compute(){
  var ps=S.players.map(function(p){return {id:p.id,name:p.name,status:"alive",outEp:null,reason:"",survived:0,used:{},comeback:false,comebackUsed:false};});
  S.episodes.forEach(function(e){
    if(!e.done) return;
    var remain=remainingAt(e.n);
    ps.forEach(function(p){
      var comebackTry = e.n===2 && p.status==="out" && p.outEp===1 && !p.comebackUsed;
      if(p.status==="out" && !comebackTry) return;
      var pk=(S.picks[p.id]||{})[e.n]||{};
      var picks=(pk.c||[]).filter(Boolean);
      var avail=remain.filter(function(c){return !p.used[c.id];});
      var fail=null;
      if(avail.length<(e.picks||1) && picks.length===0) fail="Out of picks";
      else if(picks.length===0) fail="No pick";
      else if(picks.length<(e.picks||1)) fail="Missing a pick";
      else if(picks.some(function(c){return p.used[c];})) fail="Repeat pick";
      else { var hit=picks.filter(function(c){return (e.eliminated||[]).indexOf(c)>-1;})[0]; if(hit) fail=cShort(hit)+" went home"; }
      picks.forEach(function(c){p.used[c]=true;});
      if(comebackTry){
        p.comebackUsed=true;
        if(!fail && pk.tribe && e.immunity && pk.tribe===e.immunity){p.status="alive";p.outEp=null;p.reason="";p.comeback=true;p.survived++;}
        else {p.outEp=2;p.reason="Comeback failed: "+(fail||(pk.tribe?pk.tribe+" lost immunity":"no tribe pick"));}
        return;
      }
      if(fail){p.status="out";p.outEp=e.n;p.reason=fail;} else p.survived++;
    });
  });
  var cur=current();
  ps.forEach(function(p){
    p.left=remainingAt(cur?cur.n:99).filter(function(c){return !p.used[c.id];});
    p.comebackEligible = cur && cur.n===2 && p.status==="out" && p.outEp===1;
  });
  ps.sort(function(a,b){
    var sa=a.status==="alive"?1:0, sb=b.status==="alive"?1:0;
    if(sa!==sb) return sb-sa;
    if(sa) return b.survived-a.survived||a.name.localeCompare(b.name);
    return (b.outEp||0)-(a.outEp||0)||a.name.localeCompare(b.name);
  });
  return ps;
}

/* ---------- rendering ---------- */
function render(){
  var ps=compute(), cur=current(), ld=lastDone();

  var em=elimEp();

  h+=stat(cur?("Ep "+cur.n):"Done",cur?("Picks due "+fmtDate(cur.date)+", 8 PM ET"):"Season complete");
  h+='</div>';
  if(cur){
    h+='<div class="cta"><p><strong>Episode '+cur.n+' picks</strong> — choose '+(cur.picks>1?cur.picks+" contestants":"one contestant")+' who will <em>not</em> go home. Deadline '+fmtDate(cur.date)+' at 8:00 PM ET. First submission counts.'+(cur.n===2?' Out in Episode 1? Also pick the tribe that wins immunity for your comeback.':'')+'</p>';

  }
  h+='</header>';

  h+='<div class="layout">';
  // standings
  h+='<section aria-labelledby="st-h"><div class="sec-head"><h2 id="st-h">Standings</h2><span class="muted small">Tap a player to see their picks left</span></div><div class="board">';
  if(!ps.length) h+='<div class="empty">No players yet. '+(ui.canEdit?'Add them under <strong>Players</strong> above, or import the first week\'s Google Form responses.':'The commissioner will add everyone once entries are in.')+'</div>';
  var rank=0;
  ps.forEach(function(p,i){

    var pill = p.status==="alive" ? (p.comeback?'<span class="pill alive">Back in</span>':'<span class="pill alive">Still in</span>')
      : p.comebackEligible ? '<span class="pill warn">Comeback shot</span>' : '<span class="pill out">Out · Ep '+p.outEp+'</span>';
    var meta = p.status==="alive" ? (p.survived+" ep"+(p.survived===1?"":"s")+" survived · "+p.left.length+" picks left") : esc(p.reason);
    var curPick = cur && ((S.picks[p.id]||{})[cur.n]);
    if(cur && (p.status==="alive"||p.comebackEligible)) meta += curPick && curPick.c && curPick.c.length ? ' · Ep '+cur.n+' pick in' : ' · <strong>no Ep '+cur.n+' pick yet</strong>';
    h+='<div class="row'+(p.status==="alive"?'':' is-out')+'" data-toggle="'+p.id+'" role="button" tabindex="0" aria-expanded="'+(!!ui.open[p.id])+'">';
    var unpaid = ui.canEdit && !(S.players.filter(function(x){return x.id===p.id;})[0]||{}).paid;
    h+='<div class="rank">'+(p.status==="alive"?rank:"–")+'</div><div><div class="pname">'+esc(p.name)+(unpaid?' <span class="pill warn">unpaid</span>':'')+'</div><div class="pmeta">'+meta+'</div></div>'+pill;
    if(ui.open[p.id]){
      var used=Object.keys(p.used);
      h+='<div class="detail"><div class="small muted">Used</div><div class="chips">'+(used.length?used.map(function(c){return '<span class="chip used">'+esc(cShort(c))+'</span>';}).join(""):'<span class="small muted">Nobody yet</span>')+'</div>';
      h+='<div class="small muted">Still available</div><div class="chips">'+(p.left.length?p.left.map(function(c){return '<span class="chip">'+esc(c.short)+'</span>';}).join(""):'<span class="small muted">None left</span>')+'</div></div>';
    }

  });
  h+='</div></section>';

  // castaways
  h+='<section aria-labelledby="cw-h"><div class="sec-head"><h2 id="cw-h">Castaways</h2>'+(ui.canEdit&&cur?'<span class="small muted">Tap to mark who went home in Ep '+cur.n+'</span>':'')+'</div><div class="tribes">';

/* ---------- import Google Form responses ---------- */
function matchCastaway(s){
  var t=norm(String(s).replace(/\s*\([^)]*\)\s*$/,""));
  if(!t) return null;
  var exact=S.castaways.filter(function(c){return norm(c.name)===t;});
  if(exact.length) return exact[0].id;
  var part=S.castaways.filter(function(c){return t.indexOf(norm(c.short))>-1;});
  return part.length===1?part[0].id:null;
}
function parseTs(s,date){
  var m=String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(!m) return null;
  var iso=m[3]+"-"+("0"+m[1]).slice(-2)+"-"+("0"+m[2]).slice(-2)+"T"+("0"+m[4]).slice(-2)+":"+m[5]+":"+(m[6]||"00");
  return new Date(iso+nyOffset(iso.slice(0,10)));
}
function doImport(text){
  var cur=current(); var rep=[];
  var rows=text.replace(/\r/g,"").split("\n").filter(function(l){return l.trim();}).map(function(l){return l.split("\t");});
  if(rows.length<2){ui.importReport=["Paste the header row plus at least one response."];return;}
  var hd=rows[0].map(norm);
  function col(f){for(var i=0;i<hd.length;i++) if(f(hd[i])) return i; return -1;}
  var iTs=col(function(x){return x.indexOf("timestamp")>-1;});
  var iName=col(function(x){return x.indexOf("name")>-1;});
  var iPick=col(function(x){return x.indexOf("not be eliminated")>-1||x.indexOf("pick")>-1&&x.indexOf("tribe")<0;});
  var iTribe=col(function(x){return x.indexOf("tribe")>-1||x.indexOf("immunity")>-1;});
  if(iTs<0||iName<0||iPick<0){ui.importReport=["Couldn't find the Timestamp, Name and Pick columns. Include the header row when you copy."];return;}
  var dl=deadline(cur).getTime(); var subs={}; var late=0; var added=0;
  rows.slice(1).forEach(function(r){
    var name=(r[iName]||"").trim(); if(!name) return;
    var ts=parseTs(r[iTs],cur.date);
    if(ts && ts.getTime()>dl){late++;rep.push("Late, ignored: "+name+" ("+r[iTs]+")");return;}
    var p=S.players.filter(function(x){return norm(x.name)===norm(name);})[0];
    if(!p){
      if(cur.n===1){p={id:uid(),name:name};S.players.push(p);added++;}
      else {rep.push("Unknown name \""+name+"\" — fix the spelling under Players or enter their pick by hand.");return;}
    }
    var picks=String(r[iPick]||"").split(/,\s+(?=[A-Z"“])/).map(matchCastaway);
    var bad=picks.indexOf(null)>-1;
    if(bad) rep.push("Couldn't read the pick for "+name+": \""+r[iPick]+"\"");
    var tribe="";
    if(iTribe>-1&&r[iTribe]){S.tribes.forEach(function(t){if(norm(r[iTribe]).indexOf(norm(t.name))>-1)tribe=t.name;});}
    (subs[p.id]=subs[p.id]||[]).push({t:ts?ts.getTime():0,c:picks.filter(Boolean),tribe:tribe});
  });
  var set=0;
  Object.keys(subs).forEach(function(pid){
    var list=subs[pid].sort(function(a,b){return a.t-b.t;});
    var used=usedBefore(pid,cur.n); var pick=list[0];
    var isRepeat=pick.c.some(function(c){return used[c];});
    var pname=S.players.filter(function(x){return x.id===pid;})[0].name;
    if(isRepeat && list[1]){pick=list[1];rep.push(pname+": first pick was a repeat, used their second submission.");}
    else if(list.length>1) rep.push(pname+": "+list.length+" submissions, kept the first.");
    S.picks[pid]=S.picks[pid]||{};
    S.picks[pid][cur.n]={c:pick.c.slice(0,cur.picks||1),tribe:pick.tribe};
    set++;
  });
  rep.unshift("Set Episode "+cur.n+" picks for "+set+" player"+(set===1?"":"s")+(added?" (added "+added+" new player"+(added===1?"":"s")+")":"")+(late?", ignored "+late+" late":"")+". Review under This week, then save.");
  ui.importReport=rep;
}

function weeklyMessage(){
  var cur=current(), ld=lastDone(), ps=compute();
  var alive=ps.filter(function(p){return p.status==="alive";});
  var L=[];
  if(ld){
    var gone=(ld.eliminated||[]).map(function(c){return cById(c).name;});
    L.push("Episode "+ld.n+" recap: "+(gone.length?gone.join(" and ")+" went home.":"nobody went home."));
    var outNow=ps.filter(function(p){return p.outEp===ld.n;});
    L.push(outNow.length?"League players eliminated: "+outNow.map(function(p){return p.name+" ("+p.reason+")";}).join(", ")+".":"No league players went out this week.");
    L.push(alive.length+" of "+ps.length+" still alive. Pot: $"+(S.entry*ps.length)+".");
    L.push("");
  }
  if(cur){
    L.push("Episode "+cur.n+" picks are open"+(cur.formUrl?": "+cur.formUrl:"")+".");
    L.push("Pick "+(cur.picks>1?cur.picks+" contestants":"one contestant")+" who will NOT be eliminated. Due "+fmtDate(cur.date)+" by 8:00 PM ET. First submission counts, no repeats.");
    if(cur.n===2) L.push("Out in Episode 1? Also pick the tribe that wins immunity for your one shot at a comeback.");
  }
  if(ps.length){
    L.push("");
    L.push("STANDINGS");
    ps.forEach(function(p,i){
      var used=Object.keys(p.used).map(cShort);
      if(p.status==="alive") L.push((i+1)+". "+p.name+" - still in"+(used.length?" (used: "+used.join(", ")+")":""));
      else L.push("   "+p.name+" - out Ep "+p.outEp+" ("+p.reason+")"+(p.comebackEligible?" - comeback shot this week":""));
    });
  }
  return L.join("\n");
}
function sheetTSV(){
  var ps=compute(), cur=current();
  var eps=S.episodes.filter(function(e){return e.done;});
  var rows=[["Rank","Player","Status","Episodes survived","Picks left"].concat(eps.map(function(e){return "Ep "+e.n;}))];
  ps.forEach(function(p,i){
    var status=p.status==="alive"?(p.comeback?"Back in":"Still in"):(p.comebackEligible?"Comeback shot":"Out Ep "+p.outEp+" - "+p.reason);
    rows.push([p.status==="alive"?String(i+1):"",p.name,status,String(p.survived),String(p.left.length)].concat(eps.map(function(e){
      var pk=(S.picks[p.id]||{})[e.n];return pk&&pk.c&&pk.c.length?pk.c.map(cShort).join(" + ")+(pk.tribe?" / "+pk.tribe:""):"";
    })));
  });
  rows.push([]);
  rows.push(["Updated "+new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})+(cur?" - Episode "+cur.n+" picks due "+fmtDate(cur.date)+" 8 PM ET":"")]);
  return rows.map(function(r){return r.map(function(c){return String(c).replace(/[\t\n]/g," ");}).join("\t");}).join("\n");
}

/* ---------- events ---------- */
function copy(text,msg){
  function done(){toast(msg);}
  try{ navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}
  function fallback(){var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");done();}catch(e){toast("Copy blocked — select the text manually.");}t.remove();}
}
var toastTimer;
function toast(m){ui.toast=m;render();clearTimeout(toastTimer);toastTimer=setTimeout(function(){ui.toast="";render();},2600);}
function changed(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({rev:S.rev,state:S}));}catch(e){}render();}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-toggle],[data-tab],[data-act],[data-elim],[data-remove],[data-rmtribe]");
  if(!t) return;
  var cur=current();
  if(t.dataset.toggle){ if(ev.target.closest(".detail")) return; ui.open[t.dataset.toggle]=!ui.open[t.dataset.toggle]; render(); return; }
  if(t.dataset.tab){ui.tab=t.dataset.tab;render();return;}
  if(t.dataset.elim&&cur){var a=cur.eliminated=cur.eliminated||[];var i=a.indexOf(t.dataset.elim);if(i>-1)a.splice(i,1);else a.push(t.dataset.elim);changed();return;}
  if(t.dataset.remove){if(!confirm("Remove this player and all their picks?"))return;S.players.filter(function(p){return p.id===t.dataset.remove;}).forEach(function(p){S.removed=(S.removed||[]).concat([slugName(p.name)]);});S.players=S.players.filter(function(p){return p.id!==t.dataset.remove;});delete S.picks[t.dataset.remove];changed();return;}
  if(t.dataset.rmtribe){var tr=S.tribes[+t.dataset.rmtribe];S.tribes.splice(+t.dataset.rmtribe,1);S.castaways.forEach(function(c){if(c.tribe===tr.name)c.tribe="";});changed();return;}
  var act=t.dataset.act;
  if(act==="lock"&&cur){
    if(!(cur.eliminated||[]).length && !confirm("Nobody is marked as going home in Episode "+cur.n+". Lock anyway?")) return;
    cur.done=true;
    S.episodes.push({n:cur.n+1,date:addDays(cur.date,7),picks:1,eliminated:[],immunity:"",done:false,formUrl:""});
    changed();toast("Episode "+cur.n+" locked. Save to update the page.");
  }
  if(act==="reopen"){var ld=lastDone();if(!ld)return;var nx=current();if(nx&&!(nx.eliminated||[]).length&&!Object.keys(S.picks).some(function(k){return S.picks[k][nx.n];}))S.episodes=S.episodes.filter(function(e){return e!==nx;});ld.done=false;changed();}
  if(act==="addplayer"){var inp=document.getElementById("new-player");var n=inp.value.trim();if(!n)return;S.players.push({id:uid(),name:n});changed();setTimeout(function(){var i2=document.getElementById("new-player");if(i2)i2.focus();},0);}
  if(act==="addtribe"){S.tribes.push({name:"New tribe",color:"#2C7A8C"});changed();}
  if(act==="import"){doImport(document.getElementById("imp-text").value);changed();}
  if(act==="copyscript"&&cur) copy(formScript(cur),"Form script copied — paste it at script.google.com");
  if(act==="copymsg") copy(weeklyMessage(),"Weekly email copied");
  if(act==="copysheet") copy(sheetTSV(),"Standings copied — click cell A1 in your Google Sheet and paste");
  if(act==="discard"){S=JSON.parse(saved);try{localStorage.removeItem(DRAFT_KEY);}catch(e){}ui.importReport=null;render();}
  if(act==="save") save();
  if(act==="signin") signIn();
  if(act==="signout"){try{localStorage.removeItem(TOKEN_KEY);}catch(e){}GH.token=null;ui.canEdit=false;render();}
});
document.addEventListener("keydown",function(ev){
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.dataset&&ev.target.dataset.toggle){ev.preventDefault();ev.target.click();}
  if(ev.key==="Enter"&&ev.target.id==="new-player"){ev.preventDefault();document.querySelector('[data-act="addplayer"]').click();}
});
document.addEventListener("change",function(ev){
  var t=ev.target, cur=current(), d=t.dataset;
  if(d.epf&&cur){cur[d.epf]= d.epf==="picks"?+t.value:t.value.trim(); changed(); return;}
  if(d.pick&&cur){var pk=S.picks[d.pick]=S.picks[d.pick]||{};var e=pk[cur.n]=pk[cur.n]||{c:[]};e.c=e.c||[];e.c[+d.slot]=t.value;e.c=e.c.slice(0,cur.picks||1);delete e.src;changed();return;}
  if(d.tribe&&cur){var pk2=S.picks[d.tribe]=S.picks[d.tribe]||{};var e2=pk2[cur.n]=pk2[cur.n]||{c:[]};e2.tribe=t.value;changed();return;}
  if(d.paid){S.players.forEach(function(p){if(p.id===d.paid)p.paid=t.checked;});changed();return;}
  if(d.rename){S.players.forEach(function(p){if(p.id===d.rename)p.name=t.value.trim()||p.name;});changed();return;}
  if(d.tribename){var tr=S.tribes[+d.tribename],old=tr.name,nw=t.value.trim()||old;tr.name=nw;S.castaways.forEach(function(c){if(c.tribe===old)c.tribe=nw;});S.episodes.forEach(function(e){if(e.immunity===old)e.immunity=nw;});changed();return;}
  if(d.tribecolor){S.tribes[+d.tribecolor].color=t.value;changed();return;}
  if(d.ctribe){S.castaways.forEach(function(c){if(c.id===d.ctribe)c.tribe=t.value;});changed();return;}
});

/* ---------- publish ---------- */
function buildPage(){
  S.rev=(S.rev||0)+1;
  var json=JSON.stringify(S).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">"
    +"<title>"+esc(document.title||"Survivor 51 League")+"</title>"
    +"<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>"
    +"<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap\">"
    +"<style id=\"css\">"+document.getElementById("css").textContent+"</style></head><body><div id=\"app\"></div>"
    +"<script type=\"application/json\" id=\"league-state\">"+json+SCRIPT_END
    +"<script id=\"app-js\">"+document.getElementById("app-js").textContent+SCRIPT_END
    +"</body></html>";
}
/* ---------- GitHub storage ---------- */
var GH=(function(){
  var host=location.hostname, owner=/\.github\.io$/i.test(host)?host.split(".")[0]:"";
  var seg=location.pathname.split("/").filter(Boolean)[0]||"";
  var repo=(seg && !/\.html?$/i.test(seg))?seg:(owner?owner+".github.io":"");
  try{var saved=JSON.parse(localStorage.getItem("s51-league-repo")||"null"); if(saved&&saved.owner){owner=saved.owner;repo=saved.repo;}}catch(e){}
  return {owner:owner,repo:repo,path:"data.json",token:null,sha:null};
})();
var TOKEN_KEY="s51-league-token";
function ghApi(path,opts){
  opts=opts||{};
  var h={"Accept":"application/vnd.github+json"}; if(GH.token) h.Authorization="Bearer "+GH.token;
  if(opts.body) h["Content-Type"]="application/json";
  return fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+path,{method:opts.method||"GET",headers:h,body:opts.body,cache:"no-store"});
}
function b64(str){return btoa(unescape(encodeURIComponent(str)));}
function unb64(str){return decodeURIComponent(escape(atob(str.replace(/\n/g,""))));}
function loadData(){
  var fromApi = GH.token ? ghApi("/contents/"+GH.path).then(function(r){ if(r.status===404) return null; if(!r.ok) throw r; return r.json().then(function(j){GH.sha=j.sha;return JSON.parse(unb64(j.content));}); }) : null;
  var fromSite = fetch(GH.path+"?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;});
  return (fromApi||fromSite).catch(function(){return fromSite;}).catch(function(){return null;});
}
/* ---------- picks that arrive from the Google Form (written by the Apps Script) ---------- */
function loadFormPicks(){
  var url="form-picks.json?t="+Date.now();
  var viaApi = GH.token&&GH.owner ? ghApi("/contents/form-picks.json").then(function(r){ if(!r.ok) return null; return r.json().then(function(j){return JSON.parse(unb64(j.content));}); }) : null;
  var viaSite = fetch(url,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;});
  return (viaApi||viaSite).catch(function(){return viaSite;}).catch(function(){return null;});
}
function slugName(n){return norm(n).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function mergeFormPicks(F){
  if(!F) return;
  Object.keys(F.forms||{}).forEach(function(n){
    S.episodes.forEach(function(e){ if(String(e.n)===String(n) && !e.formUrl) e.formUrl=F.forms[n]; });
  });
  Object.keys(F.episodes||{}).forEach(function(n){
    var ep=+n, entries=F.episodes[n]||{};
    var epObj=S.episodes.filter(function(e){return e.n===ep;})[0];
    Object.keys(entries).forEach(function(k){
      var f=entries[k];
      var p=S.players.filter(function(x){return norm(x.name)===norm(f.name);})[0];
      if(!p){
        if(ep!==1 || (S.removed||[]).indexOf(slugName(f.name))>-1) return;
        p={id:"f-"+slugName(f.name),name:f.name}; S.players.push(p);
      }
      if(epObj && epObj.done) return;
      S.picks[p.id]=S.picks[p.id]||{};
      var cur=S.picks[p.id][ep];
      if(!cur || !cur.c || !cur.c.length || cur.src==="form"){
        S.picks[p.id][ep]={c:(f.c||[]).slice(),tribe:f.tribe||"",src:"form"};
      }
    });
  });
}
function signIn(){
  var who=prompt("Commissioner sign-in (1 of 2)\n\nYour GitHub username and repository, like  yourname/survivor-league", GH.owner?GH.owner+"/"+(GH.repo||"survivor-league"):"");
  if(!who) return; who=who.trim().replace(/^https?:\/\/github\.com\//i,"").replace(/\/+$/,"");
  var parts=who.split("/"); GH.owner=parts[0]; GH.repo=parts[1]||"survivor-league";
  var t=prompt("Commissioner sign-in (2 of 2)\n\nPaste your GitHub token (starts with github_pat_). It's saved only in this browser.");
  if(!t) return; t=t.trim();
  GH.token=t;
  ghApi("").then(function(r){return r.ok?r.json():Promise.reject(r.status);}).then(function(repo){
    if(!(repo.permissions&&repo.permissions.push)) throw "no-push";
    try{localStorage.setItem(TOKEN_KEY,t);localStorage.setItem("s51-league-repo",JSON.stringify({owner:GH.owner,repo:GH.repo}));}catch(e){}
    return Promise.all([loadData(),loadFormPicks()]).then(function(r){ if(r[0]){S=r[0];} mergeFormPicks(r[1]); saved=JSON.stringify(S); ui.canEdit=true; toast("Signed in as commissioner."); });
  }).catch(function(){GH.token=null;toast("That token can't save to "+GH.owner+"/"+GH.repo+". Check it has Contents: Read and write.");});
}
function save(){
  if(!GH.token){toast("Sign in as commissioner first.");return;}
  var body=JSON.stringify(S,null,1);
  ui.toast="Saving…";render();
  ghApi("/contents/"+GH.path).then(function(r){return r.ok?r.json():null;}).then(function(cur){
    if(cur) GH.sha=cur.sha;
    return ghApi("/contents/"+GH.path,{method:"PUT",body:JSON.stringify({message:"League update",content:b64(body),sha:GH.sha||undefined})});
  }).then(function(r){
    if(!r.ok) throw r.status;
    return r.json().then(function(j){GH.sha=j.content.sha;saved=JSON.stringify(S);try{localStorage.removeItem(DRAFT_KEY);}catch(e){}toast("Saved. The public site updates in about a minute.");});
  }).catch(function(code){
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify({rev:S.rev,state:S}));}catch(e){}
    toast(code===401||code===403?"GitHub refused the save. Your token may have expired; sign out and back in.":"Couldn't save ("+code+"). Your changes are kept here; try again.");
  });
}

/* ---------- boot ---------- */
render();
try{GH.token=localStorage.getItem(TOKEN_KEY)||null;}catch(e){}
Promise.all([loadData(),loadFormPicks()]).then(function(r){
  if(r[0]){S=r[0];}
  mergeFormPicks(r[1]);
  saved=JSON.stringify(S);
  if(GH.token){
    ui.canEdit=true;
    try{var dr=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(dr&&dr.state&&JSON.stringify(dr.state)!==saved){S=dr.state;mergeFormPicks(r[1]);if(JSON.stringify(S)===saved){try{localStorage.removeItem(DRAFT_KEY);}catch(e2){}}}}catch(e){}
  }
  render();
});
setInterval(function(){
  if(ui.canEdit) return;
  Promise.all([loadData(),loadFormPicks()]).then(function(r){ if(r[0]){S=r[0];} mergeFormPicks(r[1]); saved=JSON.stringify(S); render(); });
},120000);
})();
</script>
